[project]
name = "souksaas"
version = "0.1.0"
description = "Autonomous fintech sales team prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sqlmodel",
    "litellm",
    "jinja2",
    "scikit-learn",
    "streamlit",
    "plotly",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv]
package = false
